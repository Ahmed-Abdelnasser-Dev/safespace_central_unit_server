services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safespace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safespace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-safespace}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/uploads
    command: ["sh", "-c", "if [ -f backend/prisma/schema.prisma ]; then cd backend && npx prisma migrate deploy --schema=prisma/schema.prisma && node server.js; elif [ -f prisma/schema.prisma ]; then npx prisma migrate deploy --schema=prisma/schema.prisma && node backend/server.js; else echo 'Error: Prisma schema not found at backend/prisma/schema.prisma or prisma/schema.prisma' >&2; exit 1; fi"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
